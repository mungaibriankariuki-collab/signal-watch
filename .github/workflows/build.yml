name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Unit tests (SignalParser)
        run: gradle :signal-parser:test --no-daemon --stacktrace

      - name: Restore signing key and API key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/signalwatch.keystore
          fi
          # local.properties is git-ignored; CI recreates it from the repo secret.
          echo "YOUTUBE_API_KEY=$YOUTUBE_API_KEY" > local.properties

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk SignalWatch.apk
          cp app/build/outputs/apk/debug/app-debug.apk SignalWatch-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SignalWatch-apk
          path: |
            SignalWatch.apk
            SignalWatch-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" SignalWatch.apk SignalWatch-debug.apk \
            --title "Signal Watch build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. SignalWatch.apk is the normal app; SignalWatch-debug.apk adds the Simulate live stream mode." \
            --latest
